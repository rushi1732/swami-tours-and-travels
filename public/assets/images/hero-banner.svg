<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="70%" stop-color="#1e1b4b" />
      <stop offset="88%" stop-color="#431407" />
      <stop offset="100%" stop-color="#7c2d12" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="65%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#f59e0b" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#ea580c" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="expresswayGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>

  <!-- Sky Canvas -->
  <rect width="1600" height="900" fill="url(#skyGrad)" />
  
  <!-- Sunrise Sun Sphere -->
  <circle cx="1040" cy="540" r="160" fill="url(#sunGlow)" />
  <circle cx="1040" cy="540" r="48" fill="#fef08a" opacity="0.95" />

  <!-- Distant Mountain Ranges (Sahyadri Western Ghats) -->
  <path d="M 0 580 L 180 500 L 360 550 L 520 480 L 720 540 L 910 470 L 1100 520 L 1280 460 L 1460 530 L 1600 490 L 1600 900 L 0 900 Z" 
        fill="#1e1b4b" opacity="0.75" />
  
  <!-- Mid-distance Ridges & Ghats -->
  <path d="M 0 630 L 220 560 L 410 610 L 630 540 L 840 600 L 1050 530 L 1260 580 L 1440 520 L 1600 570 L 1600 900 L 0 900 Z" 
        fill="#0f172a" opacity="0.9" />

  <!-- Scenic Mumbai-Pune / Samruddhi Expressway -->
  <path d="M 0 900 Q 500 760 900 680 L 980 680 Q 1200 780 1600 900 Z" fill="url(#expresswayGrad)" />
  
  <!-- Highway Center Median Strip (Golden Glow) -->
  <path d="M 400 900 Q 750 770 940 680" stroke="#f59e0b" stroke-width="4" stroke-dasharray="24 18" fill="none" opacity="0.8" />
  <path d="M 1200 900 Q 1050 780 945 680" stroke="#ffffff" stroke-width="3" stroke-dasharray="20 20" fill="none" opacity="0.4" />

  <!-- Mountain Valley Mist Overlay -->
  <ellipse cx="600" cy="670" rx="500" ry="60" fill="#fed7aa" opacity="0.12" />
  <ellipse cx="1200" cy="650" rx="400" ry="50" fill="#fef08a" opacity="0.1" />

  <!-- Stars in Upper Sky -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="120" cy="80" r="1.5" />
    <circle cx="280" cy="140" r="1.2" />
    <circle cx="450" cy="60" r="1.8" />
    <circle cx="680" cy="110" r="1" />
    <circle cx="890" cy="70" r="1.5" />
    <circle cx="1140" cy="95" r="1.2" />
    <circle cx="1380" cy="50" r="2" />
    <circle cx="1510" cy="130" r="1.4" />
  </g>
</svg>
