<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Highway Sky with Mountains & Greenery -->
    <linearGradient id="coachSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </linearGradient>

    <!-- White Coach Body -->
    <linearGradient id="coachWhiteBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Blue & Purple Gradient Wave Graphics matching 26 Seater Photo -->
    <linearGradient id="waveGraphic" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="40%" stop-color="#2563eb"/>
      <stop offset="80%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Asphalt Highway -->
    <linearGradient id="coachRoad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <filter id="coachShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- BACKGROUND: Open Highway under Blue Sky with Mountains & Green Trees -->
  <rect x="0" y="0" width="800" height="260" fill="url(#coachSky)"/>

  <!-- White Cumulus Clouds -->
  <g fill="#ffffff" opacity="0.9">
    <circle cx="100" cy="70" r="30"/>
    <circle cx="130" cy="60" r="40"/>
    <circle cx="170" cy="70" r="32"/>
    <circle cx="680" cy="80" r="35"/>
    <circle cx="720" cy="70" r="45"/>
    <circle cx="760" cy="80" r="36"/>
  </g>

  <!-- Scenic Blue/Green Mountain Silhouette -->
  <path d="M 0 210 Q 180 140 380 180 Q 580 150 800 200 L 800 240 L 0 240 Z" fill="#0369a1" opacity="0.5"/>
  <!-- Lush Green Trees along Roadside -->
  <g fill="#15803d">
    <circle cx="40" cy="210" r="40"/>
    <circle cx="90" cy="205" r="45"/>
    <circle cx="150" cy="215" r="35"/>
    <circle cx="660" cy="210" r="42"/>
    <circle cx="720" cy="205" r="48"/>
    <circle cx="780" cy="215" r="38"/>
  </g>

  <!-- Highway Crash Barrier / Divider Guardrail -->
  <rect x="0" y="235" width="800" height="25" fill="#e2e8f0"/>
  <line x1="0" y1="247" x2="800" y2="247" stroke="#94a3b8" stroke-width="3"/>

  <!-- Highway Road Surface with White Lane Hash Line -->
  <rect x="0" y="260" width="800" height="240" fill="url(#coachRoad)"/>
  <line x1="20" y1="365" x2="180" y2="365" stroke="#ffffff" stroke-width="8" stroke-dasharray="90 60"/>
  <line x1="330" y1="365" x2="490" y2="365" stroke="#ffffff" stroke-width="8" stroke-dasharray="90 60"/>
  <line x1="640" y1="365" x2="800" y2="365" stroke="#ffffff" stroke-width="8" stroke-dasharray="90 60"/>

  <!-- COACH CAST SHADOW -->
  <ellipse cx="410" cy="425" rx="360" ry="24" fill="#000000" opacity="0.75" filter="url(#coachShadow)"/>

  <!-- FORCE TEMPO TRAVELLER 26-SEATER HIGH-DECK COACH -->
  <g transform="translate(40, 40)">
    
    <!-- Long High-Deck Coach Body Silhouette -->
    <path d="M 680 335 
             L 685 280 
             C 690 190, 690 130, 680 85 
             C 670 60, 620 50, 540 48 
             L 240 48 
             C 190 48, 155 68, 130 110 
             L 80 195 
             C 60 220, 50 245, 50 280 
             L 55 335 
             C 58 355, 75 360, 100 360 
             L 120 360 
             A 58 58 0 0 0 235 360 
             L 520 360 
             A 58 58 0 0 0 635 360 
             L 670 360 
             C 685 360, 685 350, 680 335 Z" 
          fill="url(#coachWhiteBody)" stroke="#94a3b8" stroke-width="2"/>

    <!-- Rooftop AC Pod Unit (Air Conditioning High Deck) -->
    <rect x="420" y="32" width="130" height="16" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="440" y1="37" x2="530" y2="37" stroke="#64748b" stroke-width="2"/>
    <line x1="440" y1="42" x2="530" y2="42" stroke="#64748b" stroke-width="2"/>

    <!-- High Aerodynamic Cap Curve -->
    <path d="M 130 110 C 160 62, 210 48, 270 48 L 560 48 C 625 48, 670 65, 680 85 L 130 85 Z" 
          fill="#f1f5f9"/>

    <!-- Front Windshield -->
    <polygon points="135,105 235,78 235,200 85,210" fill="#091829" stroke="#334155" stroke-width="2"/>
    <polygon points="148,100 210,84 195,190 100,200" fill="rgba(255,255,255,0.25)"/>
    
    <!-- Long Row of Panoramic Passenger Windows with Protective Bars -->
    <rect x="245" y="78" width="70" height="120" rx="3" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <rect x="325" y="78" width="75" height="120" rx="3" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <rect x="410" y="78" width="75" height="120" rx="3" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <rect x="495" y="78" width="75" height="120" rx="3" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <rect x="580" y="78" width="95" height="120" rx="3" fill="#0f172a" stroke="#334155" stroke-width="2"/>

    <!-- Safety Guardrails across Windows -->
    <line x1="245" y1="160" x2="675" y2="160" stroke="#000000" stroke-width="3"/>
    <line x1="245" y1="175" x2="675" y2="175" stroke="#000000" stroke-width="3"/>

    <!-- VIBRANT BLUE & PURPLE SWEEPING WAVE GRAPHICS (Exact match to 26 Seater photo) -->
    <path d="M 210 245 C 280 230, 360 190, 480 185 C 570 180, 640 160, 675 140 L 675 165 C 640 185, 570 205, 480 210 C 360 215, 280 255, 210 270 Z" 
          fill="url(#waveGraphic)"/>
    <path d="M 230 260 C 300 245, 380 210, 500 205 C 590 200, 650 180, 675 168 L 675 185 C 650 198, 590 218, 500 225 C 380 230, 300 268, 230 282 Z" 
          fill="url(#waveGraphic)" opacity="0.85"/>

    <!-- Yellow / Amber Retro-Reflective Safety Stripe -->
    <line x1="220" y1="298" x2="675" y2="298" stroke="#f59e0b" stroke-width="5"/>

    <!-- Front Facelift: FORCE Grille -->
    <polygon points="55,235 135,230 130,295 60,300" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="65" y="240" width="60" height="12" rx="2" fill="#0f172a"/>
    <text x="95" y="250" font-family="'Outfit', sans-serif" font-size="9" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">
      FORCE
    </text>

    <!-- Chrome Force Logo & Grille Slats -->
    <rect x="65" y="255" width="60" height="36" rx="3" fill="#1e293b"/>
    <circle cx="95" cy="273" r="10" fill="none" stroke="#ffffff" stroke-width="2"/>
    <path d="M 92 267 L 98 267 L 92 278" stroke="#ffffff" stroke-width="2" fill="none"/>

    <!-- Plate -->
    <rect x="65" y="295" width="60" height="15" rx="2" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
    <text x="95" y="306" font-family="'Outfit', sans-serif" font-size="9" font-weight="900" fill="#0f172a" text-anchor="middle">
      Traveller 26S
    </text>

    <!-- Clear Vertical Twin Headlights -->
    <rect x="125" y="235" width="18" height="44" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="134" cy="245" r="5" fill="#38bdf8"/>
    <circle cx="134" cy="265" r="4" fill="#f59e0b"/>

    <!-- WHEEL 1 (Front Heavy Wheel) -->
    <g transform="translate(178, 360)">
      <circle cx="0" cy="0" r="54" fill="#090d16"/>
      <circle cx="0" cy="0" r="46" fill="#334155" stroke="#64748b" stroke-width="6"/>
      <circle cx="0" cy="0" r="32" fill="#cbd5e1" stroke="#94a3b8" stroke-width="3"/>
      <circle cx="0" cy="-18" r="4" fill="#475569"/>
      <circle cx="18" cy="0" r="4" fill="#475569"/>
      <circle cx="0" cy="18" r="4" fill="#475569"/>
      <circle cx="-18" cy="0" r="4" fill="#475569"/>
      <circle cx="0" cy="0" r="10" fill="#94a3b8"/>
    </g>

    <!-- WHEEL 2 (Dual Rear Wheels for 26-Seater Heavy Deck) -->
    <g transform="translate(578, 360)">
      <circle cx="0" cy="0" r="54" fill="#090d16"/>
      <circle cx="0" cy="0" r="46" fill="#334155" stroke="#64748b" stroke-width="6"/>
      <circle cx="0" cy="0" r="32" fill="#cbd5e1" stroke="#94a3b8" stroke-width="3"/>
      <circle cx="0" cy="-18" r="4" fill="#475569"/>
      <circle cx="18" cy="0" r="4" fill="#475569"/>
      <circle cx="0" cy="18" r="4" fill="#475569"/>
      <circle cx="-18" cy="0" r="4" fill="#475569"/>
      <circle cx="0" cy="0" r="10" fill="#94a3b8"/>
    </g>

  </g>
</svg>
