<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Sunset Sky matching Wagnor.png -->
    <linearGradient id="sunsetSkyWagon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="35%" stop-color="#fb923c"/>
      <stop offset="65%" stop-color="#f97316"/>
      <stop offset="85%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>

    <!-- Warm Golden Sun -->
    <radialGradient id="goldenSun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>

    <!-- Superior White Body with Sunset Warm Reflections -->
    <linearGradient id="wagonWhiteBodyWarm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fffbeb"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <linearGradient id="chromeTrim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <linearGradient id="terraceTiles" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78716c"/>
      <stop offset="50%" stop-color="#57534e"/>
      <stop offset="100%" stop-color="#44403c"/>
    </linearGradient>

    <filter id="wagonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="15" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- BACKGROUND: Sunset Sky with Golden Sun and City Hills -->
  <rect x="0" y="0" width="800" height="260" fill="url(#sunsetSkyWagon)"/>

  <!-- Golden Setting Sun on Left Horizon -->
  <circle cx="150" cy="115" r="45" fill="url(#goldenSun)"/>
  <circle cx="150" cy="115" r="16" fill="#ffffff"/>

  <!-- Distant City Hills / Tree Line -->
  <path d="M 0 220 Q 150 180 320 210 Q 520 170 800 215 L 800 260 L 0 260 Z" fill="#7c2d12" opacity="0.6"/>
  <!-- Terrace Railing Glass & Lights -->
  <rect x="0" y="240" width="800" height="20" fill="#431407" opacity="0.7"/>
  <circle cx="20" cy="245" r="5" fill="#fef08a" opacity="0.9"/>
  <circle cx="780" cy="245" r="5" fill="#fef08a" opacity="0.9"/>

  <!-- Stone Paved Terrace Floor -->
  <rect x="0" y="260" width="800" height="240" fill="url(#terraceTiles)"/>
  <!-- Terrace Tile Grid with Sunset Warmth -->
  <g stroke="#a8a29e" stroke-width="1" opacity="0.3">
    <line x1="0" y1="290" x2="800" y2="290"/>
    <line x1="0" y1="330" x2="800" y2="330"/>
    <line x1="0" y1="380" x2="800" y2="380"/>
    <line x1="0" y1="440" x2="800" y2="440"/>
    <line x1="160" y1="260" x2="80" y2="500"/>
    <line x1="320" y1="260" x2="260" y2="500"/>
    <line x1="500" y1="260" x2="470" y2="500"/>
    <line x1="680" y1="260" x2="710" y2="500"/>
  </g>

  <!-- CAR CAST SHADOW -->
  <ellipse cx="400" cy="430" rx="330" ry="22" fill="#000000" opacity="0.75" filter="url(#wagonShadow)"/>

  <!-- MARUTI SUZUKI WAGONR (Superior White Tall-Boy) -->
  <g transform="translate(60, 50)">
    
    <!-- Tall-Boy Chassis Body Silhouette -->
    <path d="M 620 345 
             L 640 295 
             C 650 250, 645 190, 630 140 
             C 610 80, 560 70, 500 70 
             L 280 75 
             C 240 80, 195 110, 155 160 
             L 95 200 
             C 75 220, 65 245, 68 280 
             L 74 345 
             C 78 360, 95 365, 120 365 
             L 145 365 
             A 56 56 0 0 0 255 365 
             L 470 365 
             A 56 56 0 0 0 580 365 
             L 620 365 
             C 635 365, 638 355, 620 345 Z" 
          fill="url(#wagonWhiteBodyWarm)" stroke="#94a3b8" stroke-width="2"/>

    <!-- Tall Boy High-Headroom Windows & Greenhouse -->
    <!-- Large Front Windshield -->
    <polygon points="160,155 275,85 275,190 120,205" fill="#091829" stroke="#334155" stroke-width="2"/>
    <polygon points="175,150 240,95 220,180 140,195" fill="rgba(255,255,255,0.3)"/>
    <!-- Tall Front Door Window -->
    <polygon points="285,85 430,82 430,190 285,190" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <!-- Tall Rear Door Window -->
    <polygon points="440,82 550,82 545,190 440,190" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <!-- Quarter Window -->
    <polygon points="560,85 620,135 615,190 555,190" fill="#0f172a" stroke="#334155" stroke-width="2"/>

    <!-- Black Pillar Trims (Floating Roof Aesthetic) -->
    <rect x="275" y="85" width="10" height="105" fill="#0f172a"/>
    <rect x="430" y="82" width="10" height="108" fill="#0f172a"/>
    <rect x="548" y="82" width="12" height="108" fill="#0f172a"/>

    <!-- Antenna on Roof -->
    <line x1="330" y1="74" x2="310" y2="40" stroke="#0f172a" stroke-width="3"/>

    <!-- Front Facelift: Chrome Grille Strip with Suzuki Logo -->
    <polygon points="70,250 155,240 150,290 75,295" fill="#111827"/>
    <!-- Chrome Horizontal Grille Bar -->
    <line x1="72" y1="262" x2="152" y2="255" stroke="url(#chromeTrim)" stroke-width="5"/>
    <line x1="75" y1="275" x2="148" y2="270" stroke="#64748b" stroke-width="2"/>

    <!-- Suzuki "S" Badge -->
    <g transform="translate(108, 252)">
      <ellipse cx="4" cy="5" rx="8" ry="6" fill="none" stroke="url(#chromeTrim)" stroke-width="2"/>
      <path d="M 0 0 L 8 2 L 0 8 L 8 10" stroke="url(#chromeTrim)" stroke-width="2" fill="none"/>
    </g>

    <!-- Front Plate: "WAGONR" -->
    <rect x="78" y="300" width="70" height="18" rx="2" fill="#090d16" stroke="#475569" stroke-width="1.5"/>
    <text x="113" y="313" font-family="'Outfit', sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">
      WAGONR
    </text>

    <!-- Clear Modern Headlights with Turn Signal -->
    <polygon points="148,205 198,200 190,248 142,245" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <polygon points="152,210 185,208 178,240 148,238" fill="#e0f2fe"/>
    <circle cx="168" cy="225" r="7" fill="#ffffff"/>
    <polygon points="182,210 195,205 190,230 180,225" fill="#f59e0b"/> <!-- amber indicator -->

    <!-- Fog Lamp in Lower Bumper Pocket -->
    <circle cx="95" cy="335" r="7" fill="#0f172a"/>
    <circle cx="95" cy="335" r="4.5" fill="#fef08a"/>

    <!-- High-Mounted Vertical Taillight on Rear -->
    <path d="M 622 145 L 638 150 L 634 260 L 620 255 Z" fill="#ef4444" stroke="#991b1b" stroke-width="1.5"/>

    <!-- Door Handles -->
    <rect x="315" y="196" width="22" height="6" rx="2" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
    <rect x="460" y="196" width="22" height="6" rx="2" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>

    <!-- FRONT ALLOY WHEEL (Two-Tone Diamond Cut) -->
    <g transform="translate(200, 365)">
      <circle cx="0" cy="0" r="52" fill="#0f172a"/>
      <circle cx="0" cy="0" r="45" fill="#334155" stroke="#64748b" stroke-width="5"/>
      <circle cx="0" cy="0" r="30" fill="#1e293b" stroke="url(#chromeTrim)" stroke-width="3"/>
      <!-- Spokes -->
      <line x1="-26" y1="0" x2="26" y2="0" stroke="url(#chromeTrim)" stroke-width="3"/>
      <line x1="0" y1="-26" x2="0" y2="26" stroke="url(#chromeTrim)" stroke-width="3"/>
      <line x1="-18" y1="-18" x2="18" y2="18" stroke="url(#chromeTrim)" stroke-width="3"/>
      <line x1="-18" y1="18" x2="18" y2="-18" stroke="url(#chromeTrim)" stroke-width="3"/>
      <circle cx="0" cy="0" r="9" fill="url(#chromeTrim)"/>
    </g>

    <!-- REAR ALLOY WHEEL -->
    <g transform="translate(525, 365)">
      <circle cx="0" cy="0" r="52" fill="#0f172a"/>
      <circle cx="0" cy="0" r="45" fill="#334155" stroke="#64748b" stroke-width="5"/>
      <circle cx="0" cy="0" r="30" fill="#1e293b" stroke="url(#chromeTrim)" stroke-width="3"/>
      <line x1="-26" y1="0" x2="26" y2="0" stroke="url(#chromeTrim)" stroke-width="3"/>
      <line x1="0" y1="-26" x2="0" y2="26" stroke="url(#chromeTrim)" stroke-width="3"/>
      <line x1="-18" y1="-18" x2="18" y2="18" stroke="url(#chromeTrim)" stroke-width="3"/>
      <line x1="-18" y1="18" x2="18" y2="-18" stroke="url(#chromeTrim)" stroke-width="3"/>
      <circle cx="0" cy="0" r="9" fill="url(#chromeTrim)"/>
    </g>

  </g>
</svg>
