<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Highway Daytime Blue Sky -->
    <linearGradient id="tempoSky20" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </linearGradient>

    <!-- Asphalt Road Gradient -->
    <linearGradient id="asphaltGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- White Body of Force Traveller -->
    <linearGradient id="tempoWhiteBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Blue Motion Graphics matching "Traveller 3350" -->
    <linearGradient id="blueDecal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <filter id="busShadow20" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- BACKGROUND: Clear Blue Sky with Fluffy White Clouds -->
  <rect x="0" y="0" width="800" height="260" fill="url(#tempoSky20)"/>
  
  <!-- Fluffy Cumulus Clouds -->
  <g fill="#ffffff" opacity="0.85">
    <circle cx="140" cy="80" r="35"/>
    <circle cx="180" cy="70" r="45"/>
    <circle cx="220" cy="80" r="38"/>
    <circle cx="620" cy="110" r="40"/>
    <circle cx="670" cy="95" r="50"/>
    <circle cx="720" cy="110" r="42"/>
  </g>

  <!-- Highway Crash Barrier / Concrete Guardrail -->
  <rect x="0" y="235" width="800" height="25" fill="#e2e8f0"/>
  <rect x="0" y="240" width="800" height="4" fill="#94a3b8"/>
  <rect x="0" y="250" width="800" height="4" fill="#94a3b8"/>

  <!-- Smooth Asphalt Multi-Lane Expressway -->
  <rect x="0" y="260" width="800" height="240" fill="url(#asphaltGrad)"/>
  <!-- White Highway Road Markings (Motion) -->
  <line x1="80" y1="360" x2="240" y2="360" stroke="#ffffff" stroke-width="8" stroke-dasharray="80 50"/>
  <line x1="380" y1="360" x2="540" y2="360" stroke="#ffffff" stroke-width="8" stroke-dasharray="80 50"/>
  <line x1="680" y1="360" x2="800" y2="360" stroke="#ffffff" stroke-width="8" stroke-dasharray="80 50"/>

  <!-- VEHICLE CAST SHADOW -->
  <ellipse cx="410" cy="425" rx="350" ry="24" fill="#000000" opacity="0.75" filter="url(#busShadow20)"/>

  <!-- FORCE TEMPO TRAVELLER (20-SEATER LUXURY MINIBUS) -->
  <g transform="translate(60, 45)">
    
    <!-- Van Body Silhouette with High Raised Roof -->
    <path d="M 640 330 
             L 645 280 
             C 650 200, 650 140, 640 90 
             C 630 65, 590 55, 520 52 
             L 260 52 
             C 210 52, 175 70, 150 110 
             L 100 195 
             C 80 220, 70 245, 70 280 
             L 75 330 
             C 78 350, 95 355, 120 355 
             L 140 355 
             A 58 58 0 0 0 255 355 
             L 480 355 
             A 58 58 0 0 0 595 355 
             L 630 355 
             C 645 355, 645 345, 640 330 Z" 
          fill="url(#tempoWhiteBody)" stroke="#94a3b8" stroke-width="2"/>

    <!-- High Aerodynamic Roof Cap Curve -->
    <path d="M 150 110 C 180 65, 230 52, 290 52 L 540 52 C 600 52, 635 68, 640 90 L 150 90 Z" 
          fill="#f1f5f9"/>

    <!-- Large Panoramic Tinted Side Windows with Protective Bars -->
    <!-- Front Windshield -->
    <polygon points="155,105 255,80 255,200 105,210" fill="#091829" stroke="#334155" stroke-width="2"/>
    <polygon points="168,100 230,85 215,190 120,200" fill="rgba(255,255,255,0.25)"/>
    <!-- Driver Door Window -->
    <polygon points="265,80 340,80 340,200 265,200" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <!-- Passenger Window 1 -->
    <rect x="350" y="80" width="85" height="120" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <!-- Passenger Window 2 -->
    <rect x="445" y="80" width="85" height="120" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <!-- Passenger Window 3 (Rear) -->
    <rect x="540" y="80" width="90" height="120" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2"/>

    <!-- Horizontal Protective Window Guardrails / Safety Bars -->
    <line x1="350" y1="160" x2="630" y2="160" stroke="#000000" stroke-width="3"/>
    <line x1="350" y1="175" x2="630" y2="175" stroke="#000000" stroke-width="3"/>

    <!-- Side Graphic Decal: "Traveller 3350" with Motion Stripes -->
    <g transform="translate(460, 215)">
      <!-- Motion Swirls -->
      <path d="M 0 0 L 140 0 C 150 0, 160 10, 150 20 L 10 20 Z" fill="url(#blueDecal)" opacity="0.85"/>
      <path d="M 20 24 L 160 24 C 170 24, 180 34, 170 42 L 30 42 Z" fill="url(#blueDecal)" opacity="0.9"/>
      <!-- Text: Traveller -->
      <text x="80" y="16" font-family="'Outfit', sans-serif" font-size="16" font-weight="900" font-style="italic" fill="#0284c7">
        Traveller
      </text>
      <text x="75" y="38" font-family="'Outfit', sans-serif" font-size="20" font-weight="900" font-style="italic" fill="#0369a1">
        3350
      </text>
    </g>

    <!-- Front Facelift: FORCE Grille -->
    <polygon points="75,235 155,230 150,295 80,300" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="85" y="240" width="60" height="12" rx="2" fill="#0f172a"/>
    <text x="115" y="250" font-family="'Outfit', sans-serif" font-size="9" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">
      FORCE
    </text>

    <!-- Black Honeycomb Grille & Force "F" Logo -->
    <rect x="85" y="255" width="60" height="36" rx="3" fill="#1e293b"/>
    <circle cx="115" cy="273" r="10" fill="none" stroke="#ffffff" stroke-width="2"/>
    <path d="M 112 267 L 118 267 L 112 278" stroke="#ffffff" stroke-width="2" fill="none"/>

    <!-- Front Plate: "Traveller" -->
    <rect x="85" y="295" width="60" height="15" rx="2" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
    <text x="115" y="306" font-family="'Outfit', sans-serif" font-size="9" font-weight="900" fill="#0f172a" text-anchor="middle">
      Traveller
    </text>

    <!-- Clear Vertical Twin Headlights -->
    <rect x="145" y="235" width="18" height="42" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="154" cy="245" r="5" fill="#38bdf8"/>
    <circle cx="154" cy="265" r="4" fill="#f59e0b"/>

    <!-- Black Lower Bumper & Wheel Arches -->
    <path d="M 70 305 L 140 305 L 140 340 L 75 340 Z" fill="#1e293b"/>
    <path d="M 130 355 A 62 62 0 0 0 265 355" stroke="#1e293b" stroke-width="10" fill="none"/>
    <path d="M 470 355 A 62 62 0 0 0 605 355" stroke="#1e293b" stroke-width="10" fill="none"/>

    <!-- High Chauffeur Side Mirror -->
    <path d="M 115 150 L 90 170 L 92 205 L 115 185 Z" fill="#0f172a"/>

    <!-- WHEEL 1 (Heavy Steel Wheel with Chrome Hub) -->
    <g transform="translate(198, 355)">
      <circle cx="0" cy="0" r="54" fill="#090d16"/>
      <circle cx="0" cy="0" r="46" fill="#334155" stroke="#64748b" stroke-width="6"/>
      <circle cx="0" cy="0" r="32" fill="#cbd5e1" stroke="#94a3b8" stroke-width="3"/>
      <!-- Hub circle slots -->
      <circle cx="0" cy="-18" r="4" fill="#475569"/>
      <circle cx="18" cy="0" r="4" fill="#475569"/>
      <circle cx="0" cy="18" r="4" fill="#475569"/>
      <circle cx="-18" cy="0" r="4" fill="#475569"/>
      <circle cx="0" cy="0" r="10" fill="#94a3b8"/>
    </g>

    <!-- WHEEL 2 (Rear Heavy Wheel) -->
    <g transform="translate(538, 355)">
      <circle cx="0" cy="0" r="54" fill="#090d16"/>
      <circle cx="0" cy="0" r="46" fill="#334155" stroke="#64748b" stroke-width="6"/>
      <circle cx="0" cy="0" r="32" fill="#cbd5e1" stroke="#94a3b8" stroke-width="3"/>
      <circle cx="0" cy="-18" r="4" fill="#475569"/>
      <circle cx="18" cy="0" r="4" fill="#475569"/>
      <circle cx="0" cy="18" r="4" fill="#475569"/>
      <circle cx="-18" cy="0" r="4" fill="#475569"/>
      <circle cx="0" cy="0" r="10" fill="#94a3b8"/>
    </g>

  </g>
</svg>
