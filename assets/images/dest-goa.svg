<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="goaSunset" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="35%" stop-color="#9333ea" />
      <stop offset="65%" stop-color="#f43f5e" />
      <stop offset="85%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <linearGradient id="oceanWave" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="60%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#goaSunset)" />
  <!-- Sunset Sun -->
  <circle cx="300" cy="230" r="42" fill="#fff" opacity="0.9" />

  <!-- Arabian Ocean Water -->
  <rect y="240" width="600" height="160" fill="url(#oceanWave)" />
  <!-- Ocean Glint -->
  <path d="M 270 242 L 330 242 L 320 252 L 280 252 Z" fill="#fef08a" opacity="0.7" />
  <path d="M 250 256 L 350 256 L 335 264 L 265 264 Z" fill="#fef08a" opacity="0.5" />
  <path d="M 230 270 L 370 270 L 350 278 L 250 278 Z" fill="#fef08a" opacity="0.3" />

  <!-- Sandy Shore / Beach -->
  <path d="M 0 320 Q 200 300 400 330 T 600 310 L 600 400 L 0 400 Z" fill="#d97706" opacity="0.8" />
  <path d="M 0 340 Q 250 315 600 335 L 600 400 L 0 400 Z" fill="#b45309" opacity="0.6" />

  <!-- Tropical Palm Tree Silhouettes -->
  <!-- Left Palm Trunk -->
  <path d="M 60 400 Q 90 280 130 140" stroke="#18181b" stroke-width="10" stroke-linecap="round" fill="none" />
  <!-- Palm Fronds -->
  <g stroke="#18181b" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M 130 140 Q 90 110 50 130" />
    <path d="M 130 140 Q 110 90 80 80" />
    <path d="M 130 140 Q 140 80 160 85" />
    <path d="M 130 140 Q 170 100 200 120" />
    <path d="M 130 140 Q 170 140 210 160" />
    <path d="M 130 140 Q 140 160 120 190" />
  </g>

  <!-- Right Palm -->
  <path d="M 520 400 Q 500 270 470 170" stroke="#18181b" stroke-width="8" stroke-linecap="round" fill="none" />
  <g stroke="#18181b" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M 470 170 Q 430 140 390 160" />
    <path d="M 470 170 Q 450 120 420 110" />
    <path d="M 470 170 Q 480 110 510 115" />
    <path d="M 470 170 Q 520 140 540 160" />
  </g>

  <!-- Title Card -->
  <rect x="24" y="24" width="220" height="48" rx="8" fill="#0f172a" opacity="0.85" />
  <text x="38" y="46" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">GOA & KONKAN</text>
  <text x="38" y="62" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#38bdf8">Coastal Beach & Heritage Tour</text>
</svg>
